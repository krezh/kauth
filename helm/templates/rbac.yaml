{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kauth.impersonatorName" . }}
  labels:
    {{- include "kauth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kauth.impersonatorName" . }}
  labels:
    {{- include "kauth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kauth.impersonatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kauth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- end }}
