{{- if .Values.podDisruptionBudget.enabled }}
{{- $hasMin := and (hasKey .Values.podDisruptionBudget "minAvailable") (ne .Values.podDisruptionBudget.minAvailable nil) }}
{{- $hasMax := and (hasKey .Values.podDisruptionBudget "maxUnavailable") (ne .Values.podDisruptionBudget.maxUnavailable nil) }}
{{- if eq $hasMin $hasMax }}
{{- fail "podDisruptionBudget must set exactly one of minAvailable or maxUnavailable" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kauth.fullname" . }}
  labels:
    {{- include "kauth.labels" . | nindent 4 }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if $hasMax }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kauth.selectorLabels" . | nindent 6 }}
{{- end }}
